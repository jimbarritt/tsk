name: External security events

# Polls GitHub's Dependabot, code scanning and secret scanning alert APIs and queues
# each open alert onto tsk/bootstrap's external event queue (M-BOOT-02 T-19), for the
# M-ADMIN-03 mission to process. See T-19's ledger entry for the history: an earlier
# version tried to trigger on dependabot_alert/code_scanning_alert/secret_scanning_alert
# directly, but those are webhook event types, not valid GitHub Actions `on:` triggers.
# A schedule replaced that, but the workflow's own automatic GITHUB_TOKEN, even scoped
# security-events: read, turned out to work for code scanning alerts only: Dependabot
# and secret scanning alerts reject an installation-type token outright, per GitHub's
# own API docs for those two endpoints, regardless of declared permissions. GH_PAT, a
# personal access token in the repo-admin-tasks Environment below, covers all three.

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll-alerts:
    runs-on: ubuntu-latest
    environment: "Repo Admin"
    steps:
      - name: Checkout tsk
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Poll security alerts and queue them
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          ops/local/poll-security-alerts.sh "${{ github.repository }}"
