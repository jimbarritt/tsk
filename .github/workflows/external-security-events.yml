name: External security events

# Polls GitHub's Dependabot, code scanning and secret scanning alert APIs and queues
# each open alert onto tsk/bootstrap's external event queue (M-BOOT-02 T-19), for the
# M-ADMIN-03 mission to process. Runs under this workflow's own GITHUB_TOKEN, scoped
# with security-events: read, which is separate from the Claude GitHub App
# installation that cannot read these endpoints. See T-19's ledger entry: an earlier
# version of this workflow tried to trigger on dependabot_alert/code_scanning_alert/
# secret_scanning_alert directly, but those are webhook event types, not valid
# GitHub Actions `on:` triggers, so every run failed before any job started. Polling
# on a schedule replaces that.

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

permissions:
  contents: write
  security-events: read

jobs:
  poll-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tsk
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Poll security alerts and queue them
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ops/local/poll-security-alerts.sh "${{ github.repository }}"
