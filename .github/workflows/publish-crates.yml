name: Publish to crates.io

# Publishes tsk-core, then tsk-bin, to crates.io when a GitHub release is published.
# The release's tag must be `v<version>`, with `<version>` the workspace version in
# Cargo.toml at the tagged commit. A crate whose version is already on crates.io is
# skipped, so a rerun after a partial failure publishes only what is missing.
#
# The run from the Actions tab (workflow_dispatch) takes a tag, for a release that was
# published before this workflow existed, or a run that failed.
#
# Needs the secret CARGO_REGISTRY_TOKEN in the environment `crates-io`: a crates.io API
# token with the publish-update scope for tsk-core and tsk-bin. Only a job that names the
# environment can read it. The environment's deployment rules admit `main` (for a run
# from the Actions tab) and tags matching `v*` (for a release).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.3.1"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches the workspace version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the token is set
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the secret CARGO_REGISTRY_TOKEN is not set in the environment crates-io"
            exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Publish tsk-core, then tsk-bin
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          published() {
            curl -sf -A "tsk publish workflow (github.com/jimbarritt/tsk)" \
              "https://crates.io/api/v1/crates/$1/$VERSION" >/dev/null
          }
          # tsk-bin depends on tsk-core at the same version, so tsk-core goes first.
          # cargo publish waits until crates.io serves the new version before it exits.
          for crate in tsk-core tsk-bin; do
            if published "$crate"; then
              echo "$crate $VERSION is already on crates.io, skipped"
            else
              cargo publish --package "$crate" --locked
            fi
          done
