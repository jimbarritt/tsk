name: Release

# Creates a release when a push to main carries a workspace version with no release
# yet. To release, bump the version in Cargo.toml (`just bump <version>`), commit and
# push to main. The workflow:
#
# 1. Reads the workspace version from Cargo.toml. When the tag `v<version>` already
#    exists, it stops: the push is not a release.
# 2. Verifies the commit: `plugin/tsk-version` is not above the workspace version,
#    `cargo fmt` and `cargo clippy` with warnings denied pass, and the whole test suite
#    passes with `dolt` installed, all with the locked dependencies. A failure stops the
#    release before it creates a tag.
# 3. Creates the tag on the pushed commit and the GitHub release `tsk <version>`. The
#    notes are `docs/releases/v<version>.md` when that file exists, then the subject of
#    every commit since the previous `v*` tag, then the compare link GitHub generates.
# 4. Calls publish-crates.yml to publish tsk-bin to crates.io, in the environment
#    `release`.
# 5. Calls binaries.yml to build the binaries, attach them to the release and write
#    the Homebrew formula in jimbarritt/homebrew-tap, in the environment `release`.
#
# A release created with GITHUB_TOKEN starts no other workflow, so steps 4 and 5 call
# the workflows directly rather than waiting for a `release` trigger.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read the workspace version and look for its tag
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::no workspace version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version already exists, nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check plugin/tsk-version is not above the workspace version
        run: |
          required="$(tr -d '[:space:]' < plugin/tsk-version)"
          highest="$(printf '%s\n%s\n' "$required" "$VERSION" | sort -V | tail -n 1)"
          if [ "$highest" != "$VERSION" ]; then
            echo "::error::plugin/tsk-version is $required, above the workspace version $VERSION"
            exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check the formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install dolt
        run: |
          bash plugin/hooks/install-dolt.sh
          export PATH="$HOME/.local/bin:$PATH"
          # The ledger tests print a note and pass when dolt is missing, so a missing dolt
          # must stop the run here.
          if ! command -v dolt >/dev/null 2>&1; then
            echo "::error::dolt is not installed, so the ledger tests would be skipped"
            exit 1
          fi
          dolt version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config --global user.name tsk-ci
          git config --global user.email tsk-ci@localhost

      - name: Run the tests
        run: cargo test --workspace --locked

  release:
    needs: [version, verify]
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.version.outputs.tag }}
      created: ${{ steps.create.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create the tag and the release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists, nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          {
            if [ -f "docs/releases/$TAG.md" ]; then
              cat "docs/releases/$TAG.md"
              echo
            fi
            echo "## Commits"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s (%h)' "$previous..HEAD"
            else
              git log --no-merges --format='- %s (%h)' HEAD
            fi
          } > notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "tsk $VERSION" \
            --notes-file notes.md \
            --generate-notes
          echo "created=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/publish-crates.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  binaries:
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
