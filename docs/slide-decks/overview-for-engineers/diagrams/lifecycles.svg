<svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- ===== Task lifecycle (left) ===== -->
  <text x="230" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">Task</text>

  <rect x="90" y="60" width="160" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="170" y="94" text-anchor="middle" font-size="15" fill="#1e3a8a">not-started</text>

  <line x1="170" y1="116" x2="170" y2="154" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="205" y="140" font-size="12" fill="#555">start</text>

  <rect x="90" y="156" width="160" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="170" y="190" text-anchor="middle" font-size="15" fill="#1e3a8a">in-progress</text>

  <path d="M 250 184 C 310 184, 310 230, 250 230" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="316" y="212" font-size="12" fill="#555">block</text>
  <rect x="90" y="232" width="160" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="170" y="266" text-anchor="middle" font-size="15" fill="#991b1b">blocked</text>
  <path d="M 90 260 C 30 260, 30 190, 90 184" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <line x1="170" y1="212" x2="170" y2="308" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="170" y1="288" x2="170" y2="308" stroke="#555" stroke-width="0" />
  <text x="215" y="300" font-size="12" fill="#555">complete</text>

  <rect x="90" y="310" width="160" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="170" y="344" text-anchor="middle" font-size="15" fill="#065f46">done</text>

  <text x="330" y="420" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-style="italic">not-started / in-progress / blocked all cancel too (not drawn)</text>

  <!-- divider -->
  <line x1="500" y1="20" x2="500" y2="420" stroke="#e5e5e5" stroke-width="1.5"/>

  <!-- ===== Thread lifecycle (right) ===== -->
  <text x="760" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#4c1d95">Thread</text>

  <rect x="670" y="150" width="180" height="56" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="760" y="184" text-anchor="middle" font-size="15" fill="#4c1d95">paused</text>

  <path d="M 850 165 C 940 130, 940 90, 850 90" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="900" y="80" text-anchor="middle" font-size="12" fill="#555">switch-to</text>
  <rect x="670" y="62" width="180" height="56" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="760" y="96" text-anchor="middle" font-size="15" fill="#312e81">active</text>
  <path d="M 670 90 C 590 120, 590 150, 670 178" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="600" y="135" text-anchor="middle" font-size="12" fill="#94a3b8">another switch-to</text>

  <path d="M 850 190 C 940 220, 940 260, 850 260" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="905" y="230" text-anchor="middle" font-size="12" fill="#555">wait</text>
  <rect x="670" y="262" width="180" height="56" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="760" y="296" text-anchor="middle" font-size="15" fill="#92400e">waiting</text>
  <path d="M 670 290 C 590 260, 590 210, 670 180" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="600" y="235" text-anchor="middle" font-size="12" fill="#94a3b8">resume</text>

  <text x="760" y="400" text-anchor="middle" font-size="12.5" fill="#94a3b8" font-style="italic">one actor holds a thread; a different actor resuming it is a hand-off, not a switch</text>

</svg>
