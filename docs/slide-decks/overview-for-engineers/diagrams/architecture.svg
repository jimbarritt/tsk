<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif">

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- clients -->
  <g>
    <rect x="40"  y="40" width="180" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="130" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">tsk CLI</text>

    <rect x="410" y="40" width="180" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="500" y="86" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">tsk TUI</text>

    <rect x="780" y="40" width="180" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="870" y="76" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">agent session</text>
    <text x="870" y="98" text-anchor="middle" font-size="13" fill="#1d4ed8">(human or Claude)</text>
  </g>

  <!-- socket -->
  <line x1="130" y1="120" x2="130" y2="185" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="500" y1="120" x2="500" y2="185" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="870" y1="120" x2="870" y2="185" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="40" y="190" width="920" height="60" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="500" y="225" text-anchor="middle" font-size="15" fill="#334155">JSON-RPC over the Unix socket · ~/.tsk/tskd.sock</text>

  <line x1="500" y1="250" x2="500" y2="290" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- daemon -->
  <rect x="330" y="292" width="340" height="80" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="500" y="330" text-anchor="middle" font-size="19" font-weight="700" fill="#312e81">tskd</text>
  <text x="500" y="354" text-anchor="middle" font-size="13.5" fill="#4338ca">one daemon per user, owns all state</text>

  <line x1="500" y1="372" x2="500" y2="392" stroke="#555" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- storage -->
  <rect x="290" y="394" width="420" height="20" rx="4" fill="none" stroke="none"/>
  <text x="500" y="410" text-anchor="middle" font-size="14" fill="#555">threads, tasks, event log, all under <tspan font-family="monospace">~/.tsk/</tspan>, not the project</text>

</svg>
